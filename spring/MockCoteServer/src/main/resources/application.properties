
# db setting
spring.datasource.url=jdbc:mysql://localhost:3306/mockcote?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
spring.datasource.username=ssafy
spring.datasource.password=ssafy
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# mybatis setting 
mybatis.mapper-locations=classpath:mapper/*.xml
mybatis.type-aliases-package=com.mockcote.MockCoteServer.dto
mybatis.configuration.map-underscore-to-camel-case=true
spring.docker.compose.enabled=false
spring.jackson.property-naming-strategy=SNAKE_CASE

# 기본 로깅 레벨 설정
logging.level.root=INFO
logging.level.com.mockcote=INFO

# 개발 단계에서 자세한 DB 접근관련 로그가 필요한 경우 대신 활성화
# logging.level.com.mockcote=DEBUG

# 로깅 출력 형식 설정
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n
logging.file.name=logs/application.log  # 로그 파일 저장 위치
